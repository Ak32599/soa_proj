spring.application.name=api-gateway
server.port=8005

# Eureka
eureka.client.service-url.defaultZone=http://localhost:8000/eureka/
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true

# Student Service
spring.cloud.gateway.server.webflux.routes[0].id=student-service
spring.cloud.gateway.server.webflux.routes[0].uri=lb://student-service
spring.cloud.gateway.server.webflux.routes[0].predicates[0]=Path=/students/**

# Attendance Service
spring.cloud.gateway.server.webflux.routes[1].id=attendance-service
spring.cloud.gateway.server.webflux.routes[1].uri=lb://attendance-service
spring.cloud.gateway.server.webflux.routes[1].predicates[0]=Path=/attendance/**

# Result Service
spring.cloud.gateway.server.webflux.routes[2].id=result-service
spring.cloud.gateway.server.webflux.routes[2].uri=lb://result-service
spring.cloud.gateway.server.webflux.routes[2].predicates[0]=Path=/results/**

# Auth Service
spring.cloud.gateway.server.webflux.routes[3].id=auth-service
spring.cloud.gateway.server.webflux.routes[3].uri=lb://auth-service
spring.cloud.gateway.server.webflux.routes[3].predicates[0]=Path=/auth/**